version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_interview_coach_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview_coach
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_interview_coach_api
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_interview_coach
      JWT_ACCESS_SECRET: super_secret_access_key_change_in_production_min_32_chars
      JWT_REFRESH_SECRET: super_secret_refresh_key_change_in_production_min_32_chars
      FRONTEND_URL: http://localhost

      # ─── Service Modes ─────────────────────────────
      USE_MOCK_AI: 'true'
      USE_MOCK_EMAIL: 'true'
      USE_MOCK_OAUTH: 'true'
      STORAGE_PROVIDER: 'local'

      # ─── Production API Keys (uncomment and set when ready) ─────
      # USE_MOCK_AI: 'false'
      # OPENAI_API_KEY: sk-your-openai-key
      # OPENAI_MODEL: gpt-4-turbo-preview
      # USE_MOCK_EMAIL: 'false'
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: 587
      # SMTP_USER: your_email@gmail.com
      # SMTP_PASS: your_app_password
      # USE_MOCK_OAUTH: 'false'
      # GOOGLE_CLIENT_ID: your_google_client_id
      # GOOGLE_CLIENT_SECRET: your_google_client_secret
      # STORAGE_PROVIDER: 'cloudinary'
      # CLOUDINARY_CLOUD_NAME: your_cloud
      # CLOUDINARY_API_KEY: your_key
      # CLOUDINARY_API_SECRET: your_secret
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_interview_coach_web
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
